<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xsub</title>
<style>
:root{--bg:#0f1419;--panel:#171d24;--line:#26303b;--text:#d8dee6;--muted:#8a96a3;--ok:#4caf7a;--bad:#e05d5d;--warn:#d9a441;--acc:#4a9eda;--none:#2a333d}
@media (prefers-color-scheme: light){:root{--bg:#f4f6f8;--panel:#fff;--line:#dde2e8;--text:#1d2329;--muted:#5f6b77;--ok:#2e8b57;--bad:#c63b3b;--warn:#a87410;--acc:#1f6fb2;--none:#e3e7ec}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1040px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
h1{font-size:20px;margin:0}
h2{font-size:15px;margin:0 0 10px}
h3{font-size:14px;margin:14px 0 8px}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1 1 260px}
button,select{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:6px 11px;font:inherit;cursor:pointer}
select{background:var(--bg)}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.5;cursor:wait}
input,textarea{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font:inherit;min-width:0}
textarea{width:100%;min-height:300px;padding:10px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
label{display:flex;flex-direction:column;gap:4px;flex:1 1 220px}
label.check{flex-direction:row;align-items:center;gap:8px;flex:1 1 100%}
.muted{color:var(--muted)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.big{font-size:17px;font-weight:600}
.err{white-space:pre-wrap;color:var(--bad)}
.note{white-space:pre-wrap;color:var(--warn)}
table{width:100%;border-collapse:collapse}
td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500}
tr.active td{background:color-mix(in srgb,var(--acc) 12%,transparent)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
nav.tabs button.on,.subtabs button.on{border-color:var(--acc);color:var(--acc)}
.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
pre{margin:0;max-height:420px;overflow:auto;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}
.scroll{overflow-x:auto}
.card{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
.card .row input{flex:1 1 200px}
.card .row input.n{flex:1 1 140px;max-width:220px}
.strip{display:flex;gap:1px;height:14px;margin-top:6px}
.strip i{flex:1;border-radius:2px;background:var(--none)}
.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:12px;margin-left:6px}
.banner{border:1px solid var(--acc);border-radius:8px;padding:10px;margin-bottom:12px}
code{font:12px ui-monospace,Menlo,Consolas,monospace}
.hide{display:none}
#msg{min-height:1.4em;margin-top:8px}
#nodesTable td:first-child{min-width:150px}
@media (max-width:640px){
  #nodesTable thead{display:none}
  #nodesTable tr{display:block;border-bottom:1px solid var(--line);padding:6px 0}
  #nodesTable td{display:block;border:0;padding:2px 6px}
}
</style>
</head>
<body>
<main>
<header>
  <h1>xsub <span class="muted" id="ver" style="font-size:13px;font-weight:400"></span></h1>
  <span class="grow"></span>
  <select id="lang" onchange="setLang(this.value)"><option value="ru">Русский</option><option value="en">English</option></select>
</header>
<div id="updBanner" class="banner hide"></div>

<nav class="tabs" id="tabs"></nav>

<!-- Обзор -->
<div data-tab="overview">
  <section>
    <div id="targets"></div>
    <div class="row" style="margin-top:10px">
      <button data-i18n="btnAuto" onclick="act('/api/auto','msgAuto')"></button>
      <button data-i18n="btnCheck" onclick="act('/api/check','msgCheck')"></button>
      <button data-i18n="btnSubs" onclick="act('/api/sub/refresh','msgSubs')"></button>
      <button data-i18n="btnGeo" onclick="act('/api/geo/refresh','msgGeo')"></button>
    </div>
    <div id="msg" class="muted"></div>
    <div id="errs" class="err"></div>
    <div id="warns" class="note"></div>
    <div id="sum" class="muted" style="margin-top:6px"></div>
  </section>
  <section>
    <h2 data-i18n="events"></h2>
    <div id="events" class="muted"></div>
  </section>
</div>

<!-- Подписки -->
<div data-tab="subs" class="hide">
  <section>
    <h2 data-i18n="tabSubs"></h2>
    <div id="subs"></div>
    <div class="row" style="margin-top:8px">
      <button data-i18n="addSub" onclick="addSub()"></button>
      <button class="primary" id="ssave" data-i18n="saveSubs" onclick="saveSubs()"></button>
      <span id="smsg" class="muted"></span>
    </div>
    <p class="muted" data-i18n="subsHint"></p>
  </section>
</div>

<!-- Узлы -->
<div data-tab="nodes" class="hide">
  <section>
    <h2 data-i18n="tabNodes"></h2>
    <div class="scroll"><table id="nodesTable">
      <thead><tr><th data-i18n="thNode"></th><th data-i18n="thLat"></th><th data-i18n="thRel"></th><th data-i18n="thState"></th><th></th></tr></thead>
      <tbody id="nodes"></tbody>
    </table></div>
    <p class="muted" data-i18n="nodesHint"></p>
  </section>
</div>

<!-- Списки и группы -->
<div data-tab="lists" class="hide">
  <section>
    <div class="subtabs" id="listTabs"></div>
    <p class="muted" data-i18n="listHint"></p>
    <textarea id="list" spellcheck="false"></textarea>
    <div class="row" style="margin-top:8px">
      <button class="primary" id="lsave" data-i18n="saveApply" onclick="saveList()"></button>
      <span id="lmsg" class="muted"></span>
    </div>
  </section>
  <section>
    <h2 data-i18n="groups"></h2>
    <p class="muted" data-i18n="groupsHint"></p>
    <div id="groups"></div>
    <div class="row" style="margin-top:8px">
      <button data-i18n="addGroup" onclick="addGroup()"></button>
      <button class="primary" id="gsave" data-i18n="saveGroups" onclick="saveGroups()"></button>
      <span id="gmsg" class="muted"></span>
    </div>
  </section>
</div>

<!-- Проверка сайта -->
<div data-tab="route" class="hide">
  <section>
    <h2 data-i18n="routeTitle"></h2>
    <div class="row">
      <input id="rq" class="grow" data-i18n-ph="routePh" onkeydown="if(event.key==='Enter')checkRoute()">
      <button class="primary" data-i18n="routeBtn" onclick="checkRoute()"></button>
    </div>
    <div id="rres" style="margin-top:12px"></div>
  </section>
</div>

<!-- Настройки -->
<div data-tab="settings" class="hide">
  <section>
    <h2 data-i18n="setMain"></h2>
    <div class="row">
      <label><span data-i18n="sInterval"></span><input id="s_sub_interval_hours" type="number" min="1" max="168"></label>
      <label><span data-i18n="sUA"></span><input id="s_user_agent"></label>
      <label><span data-i18n="sMax"></span><input id="s_max_nodes" type="number" min="1" max="500"></label>
      <label><span data-i18n="sFallback"></span><select id="s_fallback_tag"></select></label>
    </div>
    <h3 data-i18n="setWatch"></h3>
    <div class="row">
      <label class="check"><input type="checkbox" id="s_w_enabled"><span data-i18n="sWEnabled"></span></label>
      <label><span data-i18n="sWInterval"></span><input id="s_w_interval_sec" type="number" min="15" max="3600"></label>
      <label><span data-i18n="sWFails"></span><input id="s_w_fails_to_switch" type="number" min="1" max="10"></label>
      <label><span data-i18n="sWBg"></span><input id="s_w_background_cycle_min" type="number" min="0" max="1440"></label>
      <label class="check"><input type="checkbox" id="s_w_restart_xray"><span data-i18n="sWRestart"></span></label>
      <label style="flex-basis:100%"><span data-i18n="sWUrls"></span><textarea id="s_w_check_urls" style="min-height:70px"></textarea></label>
    </div>
    <h3>Telegram</h3>
    <div class="row">
      <label><span data-i18n="sTgToken"></span><input id="s_tg_token" autocomplete="off"></label>
      <label><span>chat_id</span><input id="s_tg_chat_id"></label>
      <label><span data-i18n="sTgDays"></span><input id="s_tg_expire_days" type="number" min="0" max="60"></label>
      <label><span data-i18n="sTgPct"></span><input id="s_tg_traffic_pct" type="number" min="0" max="100"></label>
      <label class="check"><input type="checkbox" id="s_tg_on_switch"><span data-i18n="sTgSwitch"></span></label>
      <label class="check"><input type="checkbox" id="s_tg_on_update"><span data-i18n="sTgUpdate"></span></label>
    </div>
    <div class="row"><button data-i18n="sTgTest" onclick="tgTest()"></button><span id="tgmsg" class="muted"></span></div>
    <p class="muted" data-i18n="sTgHint"></p>
    <h3 data-i18n="setAccess"></h3>
    <div class="row">
      <label><span data-i18n="sPass"></span><input id="s_password" type="password" autocomplete="new-password"></label>
      <label><span data-i18n="sLog"></span><select id="s_log_file"><option value="/tmp/xsub.log" data-i18n="logTmp"></option><option value="" data-i18n="logMem"></option><option value="/opt/var/log/xsub.log" data-i18n="logDisk"></option></select></label>
      <label class="check"><input type="checkbox" id="s_ui_allow_wan"><span data-i18n="sWan"></span></label>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="primary" id="setsave" data-i18n="saveSettings" onclick="saveSettings()"></button>
      <span id="setmsg" class="muted"></span>
    </div>
  </section>
  <section>
    <h2 data-i18n="setBackup"></h2>
    <p class="muted" data-i18n="backupHint"></p>
    <div class="row">
      <a href="/api/backup"><button data-i18n="backupBtn"></button></a>
      <label class="check" style="flex:0 1 auto"><input type="file" id="restoreFile" accept=".json,application/json" onchange="restore(this)"><span data-i18n="restoreBtn"></span></label>
      <span id="bmsg" class="muted"></span>
    </div>
  </section>
  <section>
    <h2 data-i18n="setUpdate"></h2>
    <div class="row">
      <span id="uver" class="grow"></span>
      <button data-i18n="updCheck" onclick="updCheck()"></button>
      <button class="primary" id="updBtn" data-i18n="updBtn" onclick="doUpdate()"></button>
    </div>
    <pre id="ulog" class="muted" style="margin-top:8px"></pre>
  </section>
</div>

<!-- Журнал -->
<div data-tab="log" class="hide">
  <section>
    <h2 data-i18n="tabLog"></h2>
    <pre id="log"></pre>
  </section>
</div>
</main>

let lang = 'ru';
try { lang = localStorage.getItem('xsub-lang') || ((navigator.language || 'ru').startsWith('ru') ? 'ru' : 'en'); } catch (e) {}
const t = k => (I18N[lang] && I18N[lang][k]) || I18N.ru[k] || k;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const loc = () => lang === 'ru' ? 'ru-RU' : 'en-GB';
const ago = x => {
  if (!x || x.startsWith('0001')) return t('never');
  const m = Math.floor((Date.now() - new Date(x).getTime()) / 60000);
  return m < 1 ? t('justNow') : m < 120 ? m + ' ' + t('agoMin') : Math.floor(m / 60) + ' ' + t('agoH');
};
const when = x => (!x || x.startsWith('0001')) ? t('never') : new Date(x).toLocaleString(loc());
const TABS = ['overview','subs','nodes','lists','route','settings','log'];
const TABKEY = {overview:'tabOverview',subs:'tabSubs',nodes:'tabNodes',lists:'tabLists',route:'tabRoute',settings:'tabSettings',log:'tabLog'};
let curTab = 'overview', S = null;

function applyI18n() {
  document.documentElement.lang = lang;
  $('lang').value = lang;
  document.querySelectorAll('[data-i18n]').forEach(e => e.textContent = t(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(e => e.placeholder = t(e.dataset.i18nPh));
  $('tabs').innerHTML = TABS.map(k => '<button class="' + (k === curTab ? 'on' : '') + '" onclick="tab(\'' + k + '\')">' + t(TABKEY[k]) + '</button>').join('');
}
function setLang(l) { lang = l; try { localStorage.setItem('xsub-lang', l); } catch (e) {} applyI18n(); render(); renderLists(); renderSubs(); renderGroups(); }
function tab(k) {
  if (k !== 'lists' && dirty && !confirm(t('unsaved'))) return;
  if (k !== 'lists') dirty = false;
  curTab = k;
  document.querySelectorAll('[data-tab]').forEach(e => e.classList.toggle('hide', e.dataset.tab !== k));
  applyI18n();
  if (k === 'settings') loadSettings();
}

async function post(url, body) {
  const r = await fetch(url, {method:'POST', headers:{'X-XSub':'1'}, body});
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
function setMsg(el, cls, text) { $(el).className = cls; $(el).textContent = text; }

async function act(url, key) {
  document.querySelectorAll('[data-tab="overview"] button').forEach(b => b.disabled = true);
  setMsg('msg', 'muted', t(key));
  try { await post(url); setMsg('msg', 'ok', t('done')); } catch (e) { setMsg('msg', 'bad', e.message); }
  document.querySelectorAll('[data-tab="overview"] button').forEach(b => b.disabled = false);
  load();
}

function strip(slots) {
  const now = Date.now(), slot = 30 * 60 * 1000, start = Math.floor(now / slot) * slot - 47 * slot;
  const map = {}; (slots || []).forEach(s => map[s.t * 1000] = s);
  let h = '<div class="strip">';
  for (let i = 0; i < 48; i++) {
    const ts = start + i * slot, s = map[ts];
    let c = 'var(--none)', title = new Date(ts).toLocaleTimeString(loc(), {hour:'2-digit', minute:'2-digit'});
    if (s) {
      const r = s.ok / (s.ok + s.fail);
      c = r >= 0.99 ? 'var(--ok)' : r >= 0.5 ? 'var(--warn)' : 'var(--bad)';
      title += ' — ' + s.ok + '/' + (s.ok + s.fail);
    }
    h += '<i style="background:' + c + '" title="' + esc(title) + '"></i>';
  }
  return h + '</div>';
}

function render() {
  if (!S) return;
  const s = S;
  $('ver').textContent = s.version || '';
  const newer = s.latest && newerThan(s.version, s.latest);
  $('updBanner').classList.toggle('hide', !newer);
  if (newer) $('updBanner').innerHTML = esc(t('bannerNew')) + ' ' + esc(s.latest) + ' — <a href="#" onclick="tab(\'settings\');return false">' + esc(t('bannerGo')) + '</a>';
  // цели
  const ts = s.targets || [];
  $('targets').innerHTML = ts.length ? ts.map(tg => {
    const name = tg.id ? tg.name : t('mainTarget');
    const node = tg.active ? esc(tg.active_name) + (tg.pinned ? '<span class="badge warn">' + t('manual') + '</span>' : '')
      : '<span class="warn">' + t('noNode') + '</span>';
    return '<div class="card"><div class="muted">' + esc(name) + ' ' + t('via') + (tg.down ? '<span class="badge bad">' + t('down') + '</span>' : '') + '</div>' +
      '<div class="big">' + node + '</div><div class="muted">' + t('lastOK') + ': ' + when(tg.last_ok) + '</div>' +
      '<div class="muted" style="margin-top:6px">' + t('day') + '</div>' + strip(tg.slots) + '</div>';
  }).join('') : '<div class="muted big">' + t('noNodes') + '</div>';
  $('sum').textContent = t('geo') + ': ' + when(s.geo_at) + (s.xray_up ? '' : ' · ' + t('xrayDown')) + (s.managed ? '' : ' · ' + t('notManaged'));
  $('errs').textContent = [s.apply_err, s.geo_err].concat(s.bad_nodes || []).filter(Boolean).join('\n');
  $('warns').textContent = (s.list_warns || []).join('\n');
  const ev = (s.events || []).slice().reverse().slice(0, 30);
  $('events').innerHTML = ev.length ? ev.map(e => {
    const cls = {down:'bad', up:'ok', switch:'warn', heal:'warn'}[e.kind] || 'muted';
    return '<div><span class="muted">' + esc(new Date(e.t).toLocaleString(loc())) + '</span> <span class="' + cls + '">' + esc(e.text) + '</span></div>';
  }).join('') : t('noEvents');
  // узлы
  const now = Date.now();
  const tgName = tg => tg.id ? tg.name : t('mainTarget');
  $('nodes').innerHTML = (s.nodes || []).map(n => {
    const activeIn = ts.filter(tg => tg.active === n.tag);
    const avail = ts.filter(tg => !tg.tags || tg.tags.includes(n.tag));
    const bad = n.bad_until && new Date(n.bad_until).getTime() > now;
    const lat = n.latency_ms > 0 ? n.latency_ms + ' ms' : (n.latency_ms < 0 ? '<span class="bad">—</span>' : '<span class="muted">·</span>');
    const st = n.stats || {};
    const tot = (st.ok || 0) + (st.fail || 0);
    const rel = tot ? '<span class="' + (st.score >= 0.9 ? 'ok' : st.score >= 0.6 ? 'warn' : 'bad') + '">' + Math.round(st.score * 100) + '%</span> <span class="muted">(' + st.ok + '/' + tot + ')</span>' + strip(st.slots) +
      '<div class="muted">' + t('lastTest') + ': ' + ago(st.last_test) + '</div>' : '<span class="muted">·</span>';
    let state = activeIn.map(tg => '<span class="ok">' + t('active') + (ts.length > 1 ? ' — ' + esc(tgName(tg)) : '') + '</span>').join('<br>');
    if (bad) state += (state ? '<br>' : '') + '<span class="bad">' + t('badUntil') + ' ' + new Date(n.bad_until).toLocaleTimeString(loc()) + '</span>';
    if (n.last_err) state += '<div class="muted">' + esc(n.last_err) + '</div>';
    const choices = avail.filter(tg => tg.active !== n.tag);
    let btn = '';
    if (choices.length === 1) btn = '<button onclick="pick(\'' + esc(choices[0].id) + '\',\'' + esc(n.tag) + '\')">' + t('select') + '</button>';
    else if (choices.length > 1) btn = '<select id="sel_' + esc(n.tag) + '">' + choices.map(tg => '<option value="' + esc(tg.id) + '">' + esc(tgName(tg)) + '</option>').join('') + '</select> <button onclick="pick($(\'sel_' + esc(n.tag) + '\').value,\'' + esc(n.tag) + '\')">' + t('select') + '</button>';
    return '<tr class="' + (activeIn.length ? 'active' : '') + '"><td>' + esc(n.name) + '<div class="muted">' + esc(n.proto) + ' · ' + esc(n.address) + '</div></td><td>' + lat +
      '</td><td style="min-width:150px">' + rel + '</td><td>' + state + '</td><td style="white-space:nowrap">' + btn + '</td></tr>';
  }).join('') || '<tr><td colspan="5" class="muted">' + t('noNodes') + '</td></tr>';
  $('log').textContent = (s.log || []).slice().reverse().join('\n');
  if (!subsDirty && !$('subs').contains(document.activeElement)) renderSubs();
  if (!groupsDirty && !$('groups').contains(document.activeElement)) { groups = JSON.parse(JSON.stringify(s.groups || [])); renderGroups(); }
  renderListTabs();
}

function newerThan(a, b) {
  const pa = (a || '').match(/(\d+)\.(\d+)\.(\d+)/), pb = (b || '').match(/(\d+)\.(\d+)\.(\d+)/);
  if (!pa || !pb) return false;
  for (let i = 1; i <= 3; i++) { if (+pa[i] !== +pb[i]) return +pb[i] > +pa[i]; }
  return false;
}

async function pick(target, tag) {
  setMsg('msg', 'muted', '…');
  try { await post('/api/select', JSON.stringify({Target: target, Tag: tag})); setMsg('msg', 'ok', t('done')); }
  catch (e) { setMsg('msg', 'bad', e.message); }
  load();
}

async function load() {
  try { S = await (await fetch('/api/status')).json(); } catch (e) { return; }
  render();
}

// ---------- подписки ----------
let subs = [], subsDirty = false;
const gb = n => (n / 1073741824).toFixed(n < 10737418240 ? 2 : 1);
function subState(st) {
  if (!st) return '<span class="muted">' + t('notYet') + '</span>';
  let parts = [t('nodesN') + ': ' + st.nodes, t('updated') + ': ' + when(st.at) + (st.cached ? ' (' + t('cached') + ')' : '')];
  if (st.info) {
    const used = st.info.upload + st.info.download;
    parts.push(t('traffic') + ': ' + gb(used) + (st.info.total ? ' ' + t('of') + ' ' + gb(st.info.total) : '') + ' ' + t('gb'));
    if (st.info.expire) parts.push(t('until') + ' ' + new Date(st.info.expire * 1000).toLocaleDateString(loc()));
  }
  let h = '<span class="muted">' + parts.map(esc).join(' · ') + '</span>';
  if (st.err) h += '<div class="bad">' + esc(st.err) + '</div>';
  (st.warns || []).forEach(w => h += '<div class="muted">' + esc(w) + '</div>');
  return h;
}
function renderSubs() {
  const states = (S && S.subs) || [];
  $('subs').innerHTML = subs.map((s, i) => {
    const st = (states.find(x => x.url === s.url) || {}).state;
    const inp = (k, ph, cls) => '<input class="' + (cls || '') + '" placeholder="' + esc(t(ph)) + '" value="' + esc(s[k] || '') + '" oninput="subs[' + i + '].' + k + '=this.value;subsDirty=true">';
    return '<div class="card"><div class="row">' + inp('name', 'phName', 'n') + inp('url', 'phUrl') +
      '<button onclick="subs.splice(' + i + ',1);subsDirty=true;renderSubs()">' + t('del') + '</button></div>' +
      '<div class="row" style="margin-top:6px">' + inp('exclude', 'phEx') + inp('include', 'phIn') + inp('user_agent', 'phUA', 'n') + '</div>' +
      '<div style="margin-top:6px">' + subState(st) + '</div></div>';
  }).join('') || '<div class="muted">' + t('noSubs') + '</div>';
}
function addSub() { subs.push({name: '', url: ''}); subsDirty = true; renderSubs(); }
async function saveSubs() {
  $('ssave').disabled = true; setMsg('smsg', 'muted', t('saving'));
  try {
    await post('/api/subs', JSON.stringify(subs.filter(s => s.url.trim() !== '')));
    subsDirty = false; setMsg('smsg', 'ok', t('saved'));
    subs = await (await fetch('/api/subs')).json() || []; renderSubs();
  } catch (e) { setMsg('smsg', 'bad', e.message); }
  $('ssave').disabled = false; setTimeout(load, 3000);
}

// ---------- списки ----------
let curList = 'vpn', listText = {}, dirty = false;
function listNames() {
  const g = ((S && S.groups) || []).map(x => ({id: x.id, name: x.name}));
  return [{id: 'vpn', name: t('listVPN')}, {id: 'direct', name: t('listDirect')}].concat(g);
}
function renderListTabs() {
  const names = listNames();
  if (!names.find(x => x.id === curList)) { curList = 'vpn'; showList(); }
  $('listTabs').innerHTML = names.map(x => '<button class="' + (x.id === curList ? 'on' : '') + '" onclick="openList(\'' + esc(x.id) + '\')">' + esc(x.name) + '</button>').join('');
}
function renderLists() { renderListTabs(); }
async function fetchList(id) { listText[id] = await (await fetch('/api/list?name=' + encodeURIComponent(id))).text(); }
async function openList(id) {
  if (dirty && !confirm(t('unsaved'))) return;
  curList = id; dirty = false;
  if (listText[id] === undefined) await fetchList(id);
  showList(); renderListTabs();
}
function showList() { $('list').value = listText[curList] || ''; setMsg('lmsg', 'muted', ''); }
$('list').addEventListener('input', () => dirty = true);
async function saveList() {
  $('lsave').disabled = true; setMsg('lmsg', 'muted', t('applying'));
  try {
    await post('/api/list?name=' + encodeURIComponent(curList), $('list').value);
    listText[curList] = $('list').value; dirty = false; setMsg('lmsg', 'ok', t('applied'));
  } catch (e) { setMsg('lmsg', 'bad', e.message); }
  $('lsave').disabled = false; load();
}

// ---------- группы ----------
let groups = [], groupsDirty = false;
function renderGroups() {
  const ts = (S && S.targets) || [], nodes = (S && S.nodes) || [];
  $('groups').innerHTML = groups.map((g, i) => {
    let cnt = '';
    if (g.filter !== undefined) {
      try { const re = new RegExp(g.filter.replace(/^\(\?i\)/, ''), g.filter.startsWith('(?i)') ? 'i' : ''); cnt = nodes.filter(n => re.test(n.name)).length; } catch (e) { cnt = '?'; }
    }
    return '<div class="card"><div class="row">' +
      '<input class="n" placeholder="' + esc(t('phGName')) + '" value="' + esc(g.name) + '" oninput="groups[' + i + '].name=this.value;groupsDirty=true">' +
      '<input placeholder="' + esc(t('phGFilter')) + '" value="' + esc(g.filter) + '" oninput="groups[' + i + '].filter=this.value;groupsDirty=true;renderGroupCount(' + i + ')">' +
      '<button onclick="groups.splice(' + i + ',1);groupsDirty=true;renderGroups()">' + t('del') + '</button></div>' +
      '<div class="muted" id="gcnt' + i + '" style="margin-top:6px">' + t('matched') + ': ' + cnt + '</div></div>';
  }).join('') || '<div class="muted">' + t('noGroups') + '</div>';
}
function renderGroupCount(i) {
  const g = groups[i], nodes = (S && S.nodes) || [];
  let cnt; try { const re = new RegExp(g.filter.replace(/^\(\?i\)/, ''), g.filter.startsWith('(?i)') ? 'i' : ''); cnt = nodes.filter(n => re.test(n.name)).length; } catch (e) { cnt = '?'; }
  $('gcnt' + i).textContent = t('matched') + ': ' + cnt;
}
function addGroup() { groups.push({id: '', name: '', filter: ''}); groupsDirty = true; renderGroups(); }
async function saveGroups() {
  $('gsave').disabled = true; setMsg('gmsg', 'muted', t('applying'));
  try {
    await post('/api/groups', JSON.stringify(groups));
    groupsDirty = false; setMsg('gmsg', 'ok', t('applied'));
  } catch (e) { setMsg('gmsg', 'bad', e.message); }
  $('gsave').disabled = false; await load();
}

// ---------- проверка сайта ----------
async function checkRoute() {
  const q = $('rq').value.trim(); if (!q) return;
  $('rres').innerHTML = '…';
  try {
    const r = await (await fetch('/api/route?q=' + encodeURIComponent(q))).json();
    const cls = r.route === 'direct' ? 'muted' : 'ok';
    let h = '<div class="card"><div class="muted">' + esc(r.input) + '</div><div class="big ' + cls + '">' + esc(r.target) + '</div>';
    if (r.list) h += '<div>' + t('rList') + ': ' + esc(r.list) + '</div>';
    if (r.rule) h += '<div>' + t('rRule') + ': <code>' + esc(r.rule) + '</code></div>';
    if (r.via) h += '<div>' + t('rVia') + ': <b>' + esc(r.via) + '</b></div>';
    (r.notes || []).forEach(n => h += '<div class="muted" style="margin-top:4px">' + esc(n) + '</div>');
    $('rres').innerHTML = h + '</div>';
  } catch (e) { $('rres').innerHTML = '<span class="bad">' + esc(e.message) + '</span>'; }
}

// ---------- настройки ----------
let SET = null;
async function loadSettings() {
  try { SET = await (await fetch('/api/settings')).json(); } catch (e) { return; }
  const s = SET.settings, w = s.watchdog, tg = s.telegram;
  const v = (id, x) => $(id).value = x ?? '', c = (id, x) => $(id).checked = !!x;
  v('s_sub_interval_hours', s.sub_interval_hours); v('s_user_agent', s.user_agent); v('s_max_nodes', s.max_nodes);
  $('s_fallback_tag').innerHTML = '<option value="">' + esc(t('none')) + '</option>' + (SET.outbounds || []).sort().map(o => '<option>' + esc(o) + '</option>').join('');
  v('s_fallback_tag', s.xray.fallback_tag);
  c('s_w_enabled', w.enabled); v('s_w_interval_sec', w.interval_sec); v('s_w_fails_to_switch', w.fails_to_switch);
  v('s_w_background_cycle_min', w.background_cycle_min); c('s_w_restart_xray', w.restart_xray); v('s_w_check_urls', (w.check_urls || []).join('\n'));
  v('s_tg_token', tg.token); v('s_tg_chat_id', tg.chat_id); v('s_tg_expire_days', tg.expire_days); v('s_tg_traffic_pct', tg.traffic_pct);
  c('s_tg_on_switch', tg.on_switch); c('s_tg_on_update', tg.on_update);
  v('s_password', ''); c('s_ui_allow_wan', s.ui_allow_wan);
  const lf = $('s_log_file'); if (![...lf.options].some(o => o.value === s.log_file)) lf.add(new Option(s.log_file, s.log_file)); v('s_log_file', s.log_file);
  $('uver').textContent = t('curVer') + ': ' + ((S && S.version) || '') + (S && S.latest ? ' · ' + t('newVer') + ': ' + S.latest : '');
}
function collectSettings() {
  const n = id => parseInt($(id).value, 10) || 0, v = id => $(id).value, c = id => $(id).checked;
  return {
    password: v('s_password'), sub_interval_hours: n('s_sub_interval_hours'), user_agent: v('s_user_agent'), max_nodes: n('s_max_nodes'),
    log_file: v('s_log_file'), ui_allow_wan: c('s_ui_allow_wan'), xray: {fallback_tag: v('s_fallback_tag')},
    watchdog: {enabled: c('s_w_enabled'), interval_sec: n('s_w_interval_sec'), fails_to_switch: n('s_w_fails_to_switch'),
      background_cycle_min: n('s_w_background_cycle_min'), restart_xray: c('s_w_restart_xray'),
      check_urls: v('s_w_check_urls').split('\n').map(x => x.trim()).filter(Boolean)},
    telegram: {token: v('s_tg_token'), chat_id: v('s_tg_chat_id'), expire_days: n('s_tg_expire_days'), traffic_pct: n('s_tg_traffic_pct'),
      on_switch: c('s_tg_on_switch'), on_update: c('s_tg_on_update')}
  };
}
async function saveSettings() {
  $('setsave').disabled = true; setMsg('setmsg', 'muted', t('saving'));
  try { await post('/api/settings', JSON.stringify(collectSettings())); setMsg('setmsg', 'ok', t('restarting')); setTimeout(() => location.reload(), 4000); }
  catch (e) { setMsg('setmsg', 'bad', e.message); $('setsave').disabled = false; }
}
async function tgTest() {
  setMsg('tgmsg', 'muted', '…');
  try { await post('/api/telegram/test'); setMsg('tgmsg', 'ok', t('done')); } catch (e) { setMsg('tgmsg', 'bad', e.message); }
}
async function restore(inp) {
  const f = inp.files[0]; if (!f) return;
  setMsg('bmsg', 'muted', t('restoring'));
  try { await post('/api/restore', await f.text()); setMsg('bmsg', 'ok', t('restarting')); setTimeout(() => location.reload(), 4000); }
  catch (e) { setMsg('bmsg', 'bad', e.message); }
  inp.value = '';
}
async function updCheck() {
  $('uver').textContent = '…';
  try {
    const r = await post('/api/update/check');
    $('uver').textContent = t('curVer') + ': ' + ((S && S.version) || '') + ' · ' + (r.newer ? t('newVer') + ': ' + r.latest : t('upToDate'));
    if (S) { S.latest = r.latest; render(); }
  } catch (e) { $('uver').textContent = e.message; }
}
async function doUpdate() {
  if (!confirm(t('updConfirm'))) return;
  $('updBtn').disabled = true;
  try {
    await post('/api/update');
    $('ulog').textContent = t('updStarted');
    const iv = setInterval(async () => {
      try { const l = await (await fetch('/api/update/log')).text(); if (l) $('ulog').textContent = l; } catch (e) {}
    }, 2000);
    setTimeout(() => { clearInterval(iv); location.reload(); }, 60000);
  } catch (e) { $('ulog').textContent = e.message; $('updBtn').disabled = false; }
}

(async () => {
  applyI18n(); tab('overview');
  await load();
  try { subs = await (await fetch('/api/subs')).json() || []; } catch (e) {}
  renderSubs();
  await fetchList('vpn'); showList(); renderListTabs();
  setInterval(load, 10000);
})();
</script>
